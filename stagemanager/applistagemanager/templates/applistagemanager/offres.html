{% block title %}

{% block main %}
<div class="container mb-4">
    <h2>Nos offres de stages</h2>

        <p>{{offre.intitule}}</p>
        <a href="/offres/{{offre.id_offre}}">Détails</a>
    {% endfor %}
</div>
{% endblock %}
